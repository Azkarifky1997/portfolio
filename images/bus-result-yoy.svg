<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <rect width="1600" height="900" fill="#ffffff"/>
  <!-- three up-arrows, one per route -->
  <g fill="#1b3a6b">
    <circle cx="152" cy="170" r="34"/><circle cx="242" cy="170" r="34"/><circle cx="332" cy="170" r="34"/>
  </g>
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M152 188V152M138 165l14-14 14 14"/>
    <path d="M242 188V152M228 165l14-14 14 14"/>
    <path d="M332 188V152M318 165l14-14 14 14"/>
  </g>
  <text x="120" y="330" font-size="84" font-weight="700" fill="#1b3a6b">Passenger numbers rose</text>
  <text x="120" y="425" font-size="84" font-weight="700" fill="#1b3a6b">on all three routes</text>
  <line x1="120" y1="490" x2="1480" y2="490" stroke="#e3e6e7" stroke-width="3"/>
  <text x="120" y="690" font-size="56" fill="#1b3a6b">by up to</text>
  <text x="380" y="700" font-size="190" font-weight="800" fill="#1b3a6b" letter-spacing="-5">38%</text>
  <rect x="790" y="625" width="390" height="78" rx="10" fill="#fff1cc"/>
  <text x="818" y="678" font-size="42" fill="#1b3a6b">year on year</text>
  <text x="120" y="840" font-size="26" fill="#4a5a60">Measured from ticket data, comparing the same month a year apart</text>
  <text x="1480" y="840" font-size="24" fill="#6b777b" text-anchor="end">Recreated and anonymised</text>
</svg>
